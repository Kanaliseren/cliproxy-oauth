name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node --check bin/claudex.js
      - run: npm pack --dry-run

  stable-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-stable-assets.mjs

  windows-binary-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and inspect the pinned Windows binary
        shell: pwsh
        run: |
          $env:CLAUDEX_HOME = Join-Path $env:RUNNER_TEMP "claudex-smoke"
          node bin/claudex.js setup --no-service --port 19431
          node bin/claudex.js doctor --json
